services:
  redis:
    image: redis:7-alpine
    container_name: media_gallery_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: media_gallery_app
    restart: always
    ports:
      - "38479:38479"
    environment:
      - PORT=38479
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=512
      - DATABASE_URL=file:/app/prisma_db/dev.db
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - BETTER_AUTH_SECRET=CwYFhm1l4L4Vb30mm4SgTSf558hAd8ZV
      - BETTER_AUTH_URL=http://localhost:38479
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:38479/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 40s
    volumes:
      - db_data:/app/prisma_db
      - ${HOST_MEDIA_PATH:-./}:/host_media
      - C:\:/host_drives/c
      - F:\:/host_drives/f
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  db_data:
