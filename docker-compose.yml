services:
  redis:
    image: redis:7-alpine
    container_name: media_gallery_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: media_gallery_app
    restart: always
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma_db/dev.db
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - BETTER_AUTH_SECRET=CwYFhm1l4L4Vb30mm4SgTSf558hAd8ZV
      - BETTER_AUTH_URL=http://localhost:38479
    volumes:
      - db_data:/app/prisma_db
      - ${HOST_MEDIA_PATH:-./}:/host_media:ro
    depends_on:
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: media_gallery_caddy
    ports:
      - "38479:38479"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  redis_data:
  db_data:
  caddy_data:
  caddy_config:
